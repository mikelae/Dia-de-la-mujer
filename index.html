<!DOCTYPE html>
<html lang="es">
<head>

<title>❤️FELIZ DIA DE LA MUJER❤️</title>

<style>

body{

}

}

<div class="card">

<img src="dama.png">

<h1> ❤️Feliz dia de la Mujer❤️ </h1>

<p>
A veces la vida nos regala personas que se sienten como familia.

Su cariño y su sabiduría siempre se valoran mucho.
Que nunca le falten motivos para sonreír.
</p>

<audio controls autoplay>
<source src="musica.mp3" type="audio/mpeg">
</audio>

<p>Con cariño 💌</p>
